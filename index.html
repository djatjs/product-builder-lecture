<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인공지능 동물상 테스트</title>
    <meta name="google-adsense-account" content="ca-pub-2917877920791957">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2917877920791957"
     crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>인공지능 동물상 테스트</h1>
            <p class="subtitle">강아지상 vs 오리상, 결과는?</p>
        </header>

        <main>
            <div class="upload-section">
                <input type="file" id="image-input" accept="image/*" onchange="predictImage(this)" style="display: none;">
                <div class="upload-box" onclick="document.getElementById('image-input').click();">
                    <div id="upload-label">
                        <span class="icon">📸</span>
                        <p>이곳을 눌러 사진을 업로드하세요</p>
                    </div>
                    <img id="preview-image" src="" alt="preview" style="display: none;">
                </div>
            </div>

            <div id="result-section" style="display: none;">
                <div id="loading-spinner">
                    <div class="spinner"></div>
                    <p>인공지능 분석 중...</p>
                </div>
                <div id="label-container"></div>
            </div>

            <button type="button" class="retry-btn" onclick="location.reload();" style="display: none;">다시 하기</button>
        </main>

        <div class="ad-container" style="margin-top: 30px;">
            <!-- 하단 디스플레이 광고 -->
            <ins class="adsbygoogle"
                style="display:block"
                data-ad-client="ca-pub-2917877920791957"
                data-ad-slot="auto"
                data-ad-format="auto"
                data-full-width-responsive="true"></ins>
            <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

        <footer>
            <div class="footer-item">
                <hr>
                <h3>제휴 문의</h3>
                <form action="https://formspree.io/f/mreezljy" method="POST" class="contact-form">
                    <input type="text" name="name" placeholder="성함" required>
                    <input type="email" name="email" placeholder="이메일" required>
                    <textarea name="message" placeholder="문의 내용" required></textarea>
                    <button type="submit">문의하기</button>
                </form>
            </div>
            <div id="disqus_thread"></div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="main.js"></script>
    <script>
        (function() {
            var d = document, s = d.createElement('script');
            s.src = 'https://fromsun.disqus.com/embed.js';
            s.setAttribute('data-timestamp', +new Date());
            (d.head || d.body).appendChild(s);
        })();
    </script>
</body>
</html>
