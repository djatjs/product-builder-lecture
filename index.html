<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 테트리스</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Tetris</h1>
        <div id="score-box">Score: <span id="score">0</span></div>
        <canvas id="tetris" width="240" height="400"></canvas>
        <div class="controls">
            <p>조작법:</p>
            <p>← → : 이동</p>
            <p>↓ : 빠르게 내리기</p>
            <p>↑, Q, W : 회전</p>
        </div>

        <div id="contact-section">
            <hr>
            <h3>제휴 문의</h3>
            <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST" id="contact-form">
                <div class="form-group">
                    <input type="text" name="name" placeholder="성함/업체명" required>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="이메일 주소" required>
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="문의 내용" required></textarea>
                </div>
                <button type="submit" id="submit-btn">문의하기</button>
            </form>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
