<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물상 테스트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-container">
        <h1>동물상 테스트</h1>
        <div>Teachable Machine Image Model</div>
        
        <!-- 사진 업로드 버튼 -->
        <input type="file" id="file-input" accept="image/*" onchange="readURL(this);" style="display: none;">
        <button type="button" onclick="document.getElementById('file-input').click();" id="start-btn">사진 업로드</button>

        <!-- 이미지 미리보기 영역 (웹캠 컨테이너 대신 사용) -->
        <div id="image-container">
            <img id="face-image" src="" alt="" style="max-width: 300px; border-radius: 10px; display: none; margin: 20px auto;">
        </div>
        
        <div id="label-container"></div>

        <!-- 제휴 문의 및 댓글 섹션 유지 -->
        <div id="contact-section">
            <hr>
            <h3>제휴 문의</h3>
            <form action="https://formspree.io/f/mreezljy" method="POST" id="contact-form">
                <div class="form-group">
                    <input type="text" name="name" placeholder="성함/업체명" required>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="이메일 주소" required>
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="문의 내용" required></textarea>
                </div>
                <button type="submit" id="submit-btn">문의하기</button>
            </form>
        </div>

        <div id="comments-section">
            <hr>
            <div id="disqus_thread"></div>
            <script>
                (function() {
                var d = document, s = d.createElement('script');
                s.src = 'https://fromsun.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
